policy_version: 2
status: approved_by_2233admin_pending_merge
gate_issue: 5
approved_by: 2233admin
approval_scope:
  - security
  - release
success:
  terminal_state: verified
  evidence_profile_selection: explicit
  profiles:
    github-delivery/v1:
      requires:
        - complete_github_delivery_readbacks
        - matching_installation_deployment_subject
        - fresh_matched_observations
    multica-execution/v1:
      extends: github-delivery/v1
      requires:
        - multica_workspace_readback
        - multica_runtime_online
        - multica_agent_readback
        - multica_task_or_run_completed
        - matching_installation_deployment_subject
        - fresh_matched_observations
  single_signal_never_verifies: true
  legacy_receipts:
    readable: true
    infer_profile: false
    rewrite_as_verified: false
states:
  - planned
  - applying
  - configured
  - blocked_preflight
  - awaiting_verification
  - verified
  - needs_manual_cleanup
read_only_commands:
  - status
  - diagnose
verify:
  new_acceptance_requires_explicit_approval: true
credentials:
  plaintext_fallback: forbidden
  export: forbidden
  retained_on_uninstall: true
serialization:
  unknown_sensitive_fields: reject_or_drop
  prohibited_data:
    - token
    - cookie
    - oauth_code
    - email
    - business_content
    - full_local_path
resume:
  discover_before_retry: true
  unknown_external_outcome: stop_or_manual_cleanup
rollback:
  latest_transaction_only: true
  unconfirmed_running_task: stop_compensation
uninstall:
  requires_agx_ownership_proof: true
  retain_unknown_resources: true
  retain_user_owned_resources: true
